[versions]
kotlin = "1.9.25"
paper-api = "1.21.11-R0.1-SNAPSHOT"
cloud = "2.0.0-beta.14"
cloud-kotlin = "2.0.0"
shadow = "9.0.0-beta12"
run-paper = "2.3.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud" }
cloud-kotlin = { module = "org.incendo:cloud-kotlin-extensions", version.ref = "cloud-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
